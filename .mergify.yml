scopes:
  source:
    files:
      backend:
        include:
          - backend/**
      frontend:
        include:
          - frontend/**
      docs:
        include:
          - docs/**
  default_capacity: 1
merge_queue:
  mode: parallel
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: true
    merge_conditions:
      - check-success = vm4-capacity-never-green
